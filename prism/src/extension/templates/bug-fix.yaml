name: bug-fix
version: "1.0"
description: "Triage → fix → verify a reported bug"
execution:
  mode: sequential
steps:
  - id: investigate
    name: Investigate
    agent: architect
    artifact: investigation.md
    gate: true
    tags: [technical]
  - id: fix
    name: Apply Fix
    agent: executor
    artifact: tasks.md
    depends_on: [investigate]
    tags: [code, build, implement]
  - id: verify
    name: Verify Fix
    agent: critic
    artifact: verify.md
    depends_on: [fix]
    tags: [quality]
