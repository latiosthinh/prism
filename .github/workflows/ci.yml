name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint @prism/sdk
        run: npm run lint
        working-directory: packages/prism-sdk
      - name: Lint prism extension
        run: npm run lint
        working-directory: prism

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test @prism/sdk
        run: npm test
        working-directory: packages/prism-sdk
      - name: Test prism extension
        run: npm test
        working-directory: prism

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build @prism/sdk
        run: npm run build
        working-directory: packages/prism-sdk
      - name: Build prism extension
        run: npm run build
        working-directory: prism

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Package VSIX
        run: npm run package
        working-directory: prism
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-vsix
          path: prism/*.vsix
